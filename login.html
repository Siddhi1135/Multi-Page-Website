<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login | Wanderly</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="navbar">
  <div class="container">
    <a href="index.html" class="logo"><i class="fa-solid fa-paper-plane icon"></i> Wanderly</a>
    <nav class="nav-links" id="navLinks">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="explore.html">Explore</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="nav-actions">
      <a href="login.html" class="btn btn-primary">Login</a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu"><i class="fa-solid fa-bars"></i></button>
    </div>
  </div>
</header>

<main class="auth-shell">
  <section class="auth-visual">
    <i class="fa-solid fa-paper-plane icon"></i>
    <div>
      <h2>Welcome Back!</h2>
      <p>Login to continue your journey with us and explore the world.</p>
    </div>
  </section>

  <section class="auth-form-wrap">
    <form class="auth-card">
      <h1>Login</h1>
      <p>Enter your credentials to access your account.</p>

      <div class="field-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" required>
      </div>

      <div class="field-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>
      </div>

      <div class="form-row-between">
        <label class="remember-me">
          <input type="checkbox" style="width:auto;"> Remember Me
        </label>
        <a href="#">Forgot Password?</a>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Login</button>

      <p class="auth-switch">Don't have an account? <a href="#">Sign Up</a></p>
    </form>
  </section>
</main>

<script src="main.js"></script>
</body>
</html>
